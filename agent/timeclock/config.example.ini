; Quilit time-clock agent
;
; Copy this file to `config.ini` in the same folder and fill it in.
; `config.ini` holds a secret that can write to your ERP -- keep it readable
; only by the account that runs the agent, and do not email it around.

[timeclock]

; ── The fingerprint terminal ────────────────────────────────────────────────
; The IP address shown on the device under  Menu > Comm > Ethernet, or under
; Menu > Comm > Wi-Fi on a wireless terminal such as the BioPro SA40.
;
; Wi-Fi does not change anything here: the agent talks to an IP on port 4370
; either way. It does make the fixed-address advice below matter MORE, not
; less --- a wireless client that drops off and rejoins is likelier to come
; back on a different address than a cabled one.
; It must be a fixed address, or a reservation on your router: if the router
; hands it a different one next month, the agent simply stops finding it.
device_ip = 192.168.1.201

; Almost always 4370. Leave it alone unless somebody changed it on the device.
device_port = 4370

; The device's communication key, under  Menu > Comm > Security > Comm Key.
; It is 0 on a terminal nobody has locked down.
device_password = 0


; ── Your ERP ────────────────────────────────────────────────────────────────
; No trailing slash.
erp_url = https://app.quilit.dev

; Your workspace name -- the part before .quilit.dev when you sign in.
; Leave blank for an on-premise install that serves only one company.
tenant_slug =

; Issued in the ERP under  HR > Time clock > Devices > Add device.
; It is shown ONCE, when the device is created. If you lose it, use
; "Rotate token" on the same screen to issue a new one; the old one stops
; working immediately.
device_token = paste-the-token-here


; ── How often to check ──────────────────────────────────────────────────────
; Seconds between reads. Five minutes is plenty: punches are not urgent, and
; the terminal holds them safely until the agent collects them.
poll_seconds = 300

; ── How far back to go ──────────────────────────────────────────────────────
; These terminals keep years of history, and you almost certainly do not want
; it: old punches would arrive as attendance in months that have already been
; paid.
;
; Leave this BLANK and the agent starts from the day it first runs, which is
; what you want when fitting a clock to a business that is already going.
; Set a date (YYYY-MM-DD) only if you deliberately want older records pulled in.
start_date =

; Seconds to wait on the device and on the ERP before giving up a cycle.
timeout = 20
