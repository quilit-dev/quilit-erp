[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --tb=short
markers =
    smoke: broad "nothing 500s" coverage across every endpoint
    rbac: role / permission matrix checks
    workflow: multi-step approval workflow simulations
    edge: invalid-id / deleted-relation / partial-permission edge cases
    concurrency: parallel-request races on sensitive actions
    state: entity state-transition checks
