# Static type checking, scoped deliberately.
#
# 166k lines are untyped and turning `strict` on all of them would produce a
# number nobody acts on. These four modules are where money is decided ---
# what an entry posts, what a layer costs, what an instalment owes, what a
# rate converts --- and a wrong type there is a wrong figure on a customer's
# balance sheet rather than a 500 somebody reports.
#
#   python -m mypy            (from backend/, uses `files` below)
#
# `follow_imports = silent` means imported modules are read for their types
# but their own errors are not reported, so this stays a gate on four files
# rather than a slow creep into the whole tree. Widen `files` when a module
# has been annotated, never before --- a listed module that fails is a broken
# build for everyone.
[mypy]
python_version = 3.12
strict = True
follow_imports = silent
ignore_missing_imports = True
files = accounting.py, costing.py, currency.py, installments.py

# Third-party packages without stubs. Untyped, not our problem to annotate.
[mypy-fastapi.*]
ignore_missing_imports = True
