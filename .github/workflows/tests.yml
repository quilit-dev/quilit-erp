name: Tests

# Runs the backend test-suite against BOTH database backends so SQLite (desktop /
# self-hosted default) and PostgreSQL (cloud) stay at dialect parity. A change that
# passes on one engine but breaks the other fails CI here.
#
# The Postgres job uses the same TEMPLATE-database cloning the local suite uses
# (conftest.py), so the superuser `postgres` role is required (CREATE DATABASE).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]

    services:
      # Always available; only the `postgres` matrix leg actually uses it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_BACKEND: ${{ matrix.backend }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcd
      COOKIE_SECURE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-cloud.txt -c backend/constraints.txt
          # httpx backs FastAPI's TestClient; pytest is the runner.
          pip install pytest httpx moto fakeredis

      - name: Run test suite (${{ matrix.backend }})
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider

  # Phase 2: schema-per-tenant isolation. Runs only the multitenancy suite, in
  # TENANCY=schema mode on Postgres (the matrix job above skips it via skipif).
  multitenancy:
    name: multitenancy (postgres, schema-per-tenant)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_BACKEND: postgres
      TENANCY: schema
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcd
      COOKIE_SECURE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-cloud.txt -c backend/constraints.txt
          pip install pytest httpx moto fakeredis

      - name: Run schema-per-tenant isolation + lifecycle tests
        working-directory: backend
        run: |
          python -m pytest tests/test_multitenancy.py tests/test_platform.py \
                           tests/test_tenant_security.py -q -p no:cacheprovider

  # The frontend gate. esbuild does no scope analysis, so a missing import
  # builds fine and white-screens at runtime; lint is the only thing that
  # catches it. Kept as its own job so a frontend break is legible without
  # reading a backend log.
  frontend:
    name: frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend_src/package-lock.json

      - name: Install dependencies
        working-directory: frontend_src
        run: npm ci

      - name: Lint (no-undef / jsx-no-undef / rules-of-hooks)
        working-directory: frontend_src
        run: npx eslint src --max-warnings 0

      - name: Tests
        working-directory: frontend_src
        run: npm test

      - name: Build
        working-directory: frontend_src
        run: npm run build
