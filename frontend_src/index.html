<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#714B67" />
    <!-- The tenant's own logo, resolved server-side from the request host, with
         the product mark returned when they have uploaded none — so this URL
         always answers with an image. Static rather than swapped in by script:
         Chrome reads the icon while parsing the head and does not reliably
         repaint when JavaScript rewrites the href later. -->
    <link rel="icon" href="/api/settings/favicon" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- iOS ignores the manifest's display mode; this is the only way Safari
         opens an installed shortcut without browser chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Quilit" />
    <title>ERP System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
